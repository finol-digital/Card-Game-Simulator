name: Test Unity Builder fork - Windows Store packaging
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: unity-builder-fork-test-${{ github.ref }}
  cancel-in-progress: false
env:
  UNITY_VERSION: 6000.3.15f1
jobs:
  buildWSAPlayer:
    name: Build for WSAPlayer
    runs-on: windows-2022
    outputs:
      buildVersion: ${{ steps.build.outputs.buildVersion }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@v6
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard
      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-WSAPlayer-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WSAPlayer
      - name: Build Unity Project
        id: build
        timeout-minutes: 45
        uses: davidmfinol/unity-builder@cb3f62ea5f1a2ea5af1f9125f895406f795677bb
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL_PERSONAL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD_PERSONAL }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL_PERSONAL }}
        with:
          targetPlatform: WSAPlayer
          buildMethod: Cgs.Editor.BuildCgs.BuildWithOptions
          cliVersion: v0.1.71
      - name: Verify version outputs match the built package
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.build.outputs.buildVersion }}
          ANDROID_VERSION_CODE: ${{ steps.build.outputs.androidVersionCode }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_VERSION)) {
            throw 'Unity Builder did not publish buildVersion.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_VERSION_CODE)) {
            throw 'Unity Builder did not publish androidVersionCode.'
          }
          [xml]$manifest = Get-Content -LiteralPath 'build/WSAPlayer/WSAPlayer/Card Game Simulator/Package.appxmanifest'
          $expected = "$env:BUILD_VERSION.0"
          if ($manifest.Package.Identity.Version -ne $expected) {
            throw "Package version $($manifest.Package.Identity.Version) does not match $expected."
          }
          Write-Host "Verified buildVersion=$env:BUILD_VERSION and androidVersionCode=$env:ANDROID_VERSION_CODE."
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: cgs-WSAPlayer
          path: build/WSAPlayer
    timeout-minutes: 60
  deployToMicrosoftStore:
    name: Verify Windows Store package
    runs-on: windows-2022
    needs: buildWSAPlayer
    steps:
      - name: Verify the version passed between jobs
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.buildWSAPlayer.outputs.buildVersion }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_VERSION)) {
            throw 'The buildVersion job output is empty.'
          }
          Write-Host "Received buildVersion=$env:BUILD_VERSION from the build job."
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Download WSAPlayer Artifact
        uses: actions/download-artifact@v8
        with:
          name: cgs-WSAPlayer
          path: build/WSAPlayer
      - name: Move Card-Game-Simulator.git
        run: |
          mkdir C:/Card-Game-Simulator.git
          mkdir C:/Card-Game-Simulator.git/build
          mv * C:/Card-Game-Simulator.git
      - name: Prepare project by fixing UnityWSAPlayerDir and removing to_remove.txt
        working-directory: C:/Card-Game-Simulator.git
        shell: pwsh
        env:
          UnityWsaPlayerDir: ${{ format('C:\Program Files\Unity\Hub\Editor\{0}\Editor\Data\PlaybackEngines\MetroSupport\', env.UNITY_VERSION) }}
          WsaPlayerDirectory: build\WSAPlayer\WSAPlayer
          UwpProjectDirectory: build\WSAPlayer\WSAPlayer\Card Game Simulator
        run: |
          [xml]$manifest = get-content ".\$env:WsaPlayerDirectory\UnityCommon.props"
          $manifest.Project.PropertyGroup.UnityWSAPlayerDir = "$env:UnityWsaPlayerDir"
          $manifest.save(".\$env:WsaPlayerDirectory\UnityCommon.props")
          echo ".\$env:WsaPlayerDirectory\UnityCommon.props"
          cat ".\$env:WsaPlayerDirectory\UnityCommon.props"
          $content_to_remove = Get-Content -Path C:\Card-Game-Simulator.git\msstore\to_remove.txt -Raw
          echo "$content_to_remove"
          $targetContent = Get-Content -Path ".\$env:UwpProjectDirectory\Card Game Simulator.vcxproj" -Raw
          $updatedContent = $targetContent -replace [regex]::Escape($content_to_remove), ''
          $updatedContent | Set-Content -Path ".\$env:UwpProjectDirectory\Card Game Simulator.vcxproj"
          cat ".\$env:UwpProjectDirectory\Card Game Simulator.vcxproj"
      - name: Upload Build2
        uses: actions/upload-artifact@v7
        with:
          name: cgs-WSAPlayer2
          path: ${{ format('{0}\build\WSAPlayer', 'C:\Card-Game-Simulator.git') }}
      - name: Add Package.StoreAssociation.xml to .vcxproj
        uses: mingjun97/file-regex-replace@v1
        with:
          regex: <ProjectName>CardGameSimulator</ProjectName></PropertyGroup>
          replacement: <ProjectName>CardGameSimulator</ProjectName></PropertyGroup><ItemGroup><None Include="Package.StoreAssociation.xml" /></ItemGroup>
          path: C:/Card-Game-Simulator.git/build/WSAPlayer/WSAPlayer/Card Game Simulator
      - name: Add Package.StoreAssociation.xml to .vcxproj.filters
        uses: mingjun97/file-regex-replace@v1
        with:
          regex: </ItemGroup>
          replacement: </ItemGroup><ItemGroup><None Include="Package.StoreAssociation.xml" /></ItemGroup>
          path: C:/Card-Game-Simulator.git/build/WSAPlayer/WSAPlayer/Card Game Simulator
          include: Card Game Simulator\.vcxproj\.filters
      - name: Update the Package.appxmanifest
        working-directory: C:/Card-Game-Simulator.git
        shell: pwsh
        env:
          UwpProjectDirectory: build\WSAPlayer\WSAPlayer\Card Game Simulator
        run: |
          Copy-Item "C:\Card-Game-Simulator.git\msstore\Package.StoreAssociation.xml" -Destination ".\$env:UwpProjectDirectory\"
          Copy-Item "C:\Card-Game-Simulator.git\msstore\CardGameSimulator.vcxproj.user" -Destination ".\$env:UwpProjectDirectory\"
          [xml]$manifest = get-content ".\$env:UwpProjectDirectory\Package.appxmanifest"
          $manifest.Package.Identity.Name = "FinolDigitalLLC.CardGameSimulator"
          $manifest.Package.Identity.Publisher = "CN=BBF9912B-079E-4CCE-A441-0D6EA6798115"
          $manifest.save(".\$env:UwpProjectDirectory\Package.appxmanifest")
          echo ".\$env:UwpProjectDirectory\Package.appxmanifest"
          cat ".\$env:UwpProjectDirectory\Package.appxmanifest"
      - name: Setup Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup Unity
        uses: davidmfinol/setup-unity@master
        with:
          project-path: C:/Card-Game-Simulator.git
          unity-modules: universal-windows-platform
      - name: Build the .msixupload with MSBuild
        working-directory: C:/Card-Game-Simulator.git
        shell: pwsh
        env:
          SolutionPath: build\WSAPlayer\WSAPlayer\Card Game Simulator.sln
        run: msbuild $env:SolutionPath /p:Configuration="Master" /p:Platform="x64" /p:UapAppxPackageBuildMode="StoreUpload" /p:AppxBundle="Always" /p:AppxBundlePlatforms="x64" /p:AppxPackageSigningEnabled=false
      - name: Copy .msixupload
        working-directory: C:/Card-Game-Simulator.git
        shell: pwsh
        env:
          APPX_PATH: ${{ format('build\WSAPlayer\WSAPlayer\AppPackages\Card Game Simulator\Card Game Simulator_{0}.0_x64_bundle_Master.msixupload', needs.buildWSAPlayer.outputs.buildVersion) }}
          upload_path: ${{ format('Card Game Simulator_{0}.0_x64_bundle_Master.msixupload', needs.buildWSAPlayer.outputs.buildVersion) }}
        run: Copy-Item ".\$env:APPX_PATH" -Destination ".\$env:upload_path"
      - name: Upload .msixupload
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ format('Card Game Simulator_{0}.0_x64_bundle_Master.msixupload', needs.buildWSAPlayer.outputs.buildVersion) }}
          path: ${{ format('{0}\Card Game Simulator_{1}.0_x64_bundle_Master.msixupload', 'C:\Card-Game-Simulator.git', needs.buildWSAPlayer.outputs.buildVersion) }}
    timeout-minutes: 90
