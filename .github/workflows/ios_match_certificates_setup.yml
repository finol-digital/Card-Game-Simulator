name: iOS Match Certificates Setup

on: workflow_dispatch

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Setup fastlane match certificates for iOS
        shell: bash
        run: |
          bundle exec fastlane ios match_init_ci
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          GH_PAT: ${{ secrets.CGS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}