name: Release branch policy

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Validate trusted event metadata only; never check out or execute PR code.
permissions:
  statuses: write

jobs:
  develop-to-main:
    name: Validate release branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require this repository's develop branch
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const sameRepository = pr.head.repo?.full_name === repository;
            // Dependabot security updates always target the default branch (main).
            // Version updates target develop through .github/dependabot.yml.
            const isDependabot = sameRepository
              && pr.user?.login === 'dependabot[bot]'
              && pr.head.ref.startsWith('dependabot/');
            const allowed = sameRepository && (pr.head.ref === 'develop' || isDependabot);
            // pull_request_target runs on the base SHA. Report on the PR head so
            // this result can satisfy the required status check for the PR.
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'Develop to main',
              state: allowed ? 'success' : 'failure',
              description: allowed
                ? (isDependabot
                  ? 'Dependabot security update verified.'
                  : 'Release PR source verified: develop -> main.')
                : 'PRs to main must come from this repository’s develop branch.',
              target_url: `${context.serverUrl}/${repository}/actions/runs/${context.runId}`
            });
            if (!allowed) {
              core.setFailed('Integrate changes into this repository’s develop branch before opening a PR to main.');
            }
